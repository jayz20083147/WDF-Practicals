<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | StudentHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo">➵</div>
      <div>
        <h2>StudentHub</h2>
        <p>Student Portal</p>
      </div>
    </div>

    <nav class="site-nav">
      <a href="home.html">Home</a>
      <a href="timetable.html">Timetable</a>
      <a href="results.html">Results</a>
      <a href="courses.html">Courses</a>
      <a href="register.html">Register</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="container">
    <div class="card registration-card">
      <h1>Contact StudentHub</h1>
      <p>Have questions or feedback? Leave us a message below.</p>

      <form id="contactForm" action="register.php" method="POST" novalidate>
        <input type="hidden" name="form_type" value="contact" />

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          />
          <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="student@example.com"
            required
          />
          <small class="error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your query or feedback here..."
            required
          ></textarea>
          <small class="error" id="messageError"></small>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>
</body>
</html>
